name: Scanner voli weekend

on:
  schedule:
    # ogni giorno alle 05:17 UTC = 07:17 ora legale / 06:17 ora solare italiana
    # (GitHub può ritardare l'avvio di qualche minuto)
    - cron: "17 5 * * *"
  workflow_dispatch:        # pulsante "Run workflow" per lanciarlo a mano
    inputs:
      prova:
        description: "Usa dati di prova (nessuna ricerca reale)"
        type: boolean
        default: false

permissions:
  contents: write           # serve per salvare lo storico dei prezzi

concurrency:
  group: scanner-voli
  cancel-in-progress: false

jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Test rapidi
        run: python -m pytest -q

      - name: Cerca voli e invia su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.prova }}" = "true" ]; then
            python -m scanner.main --prova
          else
            python -m scanner.main
          fi

      - name: Salva lo storico dei prezzi
        if: ${{ inputs.prova != true }}
        run: |
          git config user.name "scanner-voli"
          git config user.email "scanner-voli@users.noreply.github.com"
          git add data/prezzi.json data/diagnostica.txt
          git diff --cached --quiet || git commit -m "Prezzi del $(date +%F)"
          git push
