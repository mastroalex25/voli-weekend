# ============================================================
#  SCANNER VOLI WEEKEND - configurazione
#  Modifica questo file direttamente da GitHub (icona matita).
# ============================================================

partenza: BRI                # aeroporto di partenza

passeggeri:
  adulti: 3                  # 16+ anni (Sofia conta come adulta per le compagnie)
  ragazzi_12_15: 1           # Flavio: "teen" per Ryanair, adulto per Google/Wizz

# Aeroporti alternativi: entrano in classifica solo se, sommando il costo
# extra dell'auto, fanno risparmiare almeno "risparmio_minimo" rispetto a Bari.
# costo_extra = carburante + pedaggi + parcheggio IN PIÙ rispetto ad andare a Bari
# minuti_extra = tempo di guida in più (sposta l'orario minimo di partenza e
#                anticipa l'orario massimo di atterraggio al ritorno)
aeroporti_alternativi:
  BDS: {nome: "Brindisi", costo_extra: 35, minuti_extra: 70}
  NAP: {nome: "Napoli", costo_extra: 75, minuti_extra: 80}
risparmio_minimo: 80

orari:
  andata_dopo: "16:00"       # se il giorno di partenza è lavorativo
  ritorno_partenza_dopo: "00:00"   # volo di rientro (ultimo giorno): qualsiasi ora
  ritorno_arrivo_entro: null       # (non usato: vale la regola sotto)
  rientro_a_bari_entro_giorno_dopo: "05:00"  # atterraggio a Bari entro le 5 del mattino dopo l'ultimo giorno libero

bagaglio:
  trolley_cabina: false      # false = solo borsa piccola sotto il sedile (gratis sulle low cost)
                             # true  = trolley 10 kg in cabina (Google aggiunge il costo stimato)

ricerca:
  settimane_avanti: 12       # quanto lontano guardare nel calendario
  giorni_minimi_preavviso: 2 # ignora partenze troppo vicine
  max_scali: 1               # 0 = solo diretti, 1 = fino a uno scalo
  notti_max_finestra: 4      # nelle vacanze lunghe (Natale, Pasqua) spezza in viaggi di N notti
  google_max_ricerche_giorno: 450   # limite per non farsi bloccare da Google (da Bari)
  google_max_ricerche_alternativi: 200   # in più, divise tra Brindisi e Napoli
  pausa_tra_ricerche_sec: 2.0
  validita_cache_giorni: 3   # prezzi non ricontrollati oggi restano validi per N giorni

classifica:
  top: 5
  una_volta_per_citta: true  # niente 5 risultati tutti per la stessa città
  sezione_ponti: 3           # quanti "migliori ponti" mostrare a parte (0 = no)
  altre_in_breve: 7          # dopo la top 5, quante altre città elencare su una riga ciascuna
                             # (etichette: ✨ mai proposta, 🔻 prezzo sceso, "già vista")

fonti:
  google_flights: true
  ryanair: true
  wizzair: true

# Paesi da escludere per i risultati Ryanair/Wizz (codici o nomi)
escludi_paesi: ["Italy", "Italia", "IT",
                "BE", "Belgium", "Belgio",          # Belgio: già visitato (itinerante)
                "NL", "Netherlands", "Paesi Bassi",  # Olanda: già visitata (itinerante)
                "MA", "Morocco", "Marocco"]          # Marocco: già visitato (itinerante)

# Città già viste: i loro aeroporti non compaiono mai in classifica.
# Londra resta perché la rifaresti. Aggiungi o togli codici a piacere.
escludi_aeroporti:
  - TIA            # Tirana (non interessa)
  - WAW            # Varsavia
  - WMI            # Varsavia Modlin
  - MAD            # Madrid / Toledo
  - VLC            # Valencia
  - SVQ            # Siviglia (Andalusia)
  - AGP            # Malaga (Andalusia)
  - GRX            # Granada (Andalusia)
  - XRY            # Jerez (Andalusia)
  - LEI            # Almeria (Andalusia)
  - ODB            # Cordova (Andalusia)
  - CDG            # Parigi
  - ORY            # Parigi Orly
  - BVA            # Parigi Beauvais
  - BUD            # Budapest
  - OTP            # Bucarest
  - BBU            # Bucarest Baneasa
  - GDN            # Danzica
  - BCN            # Barcellona
  - GRO            # Girona (Ryanair la vende come "Barcellona")
  - REU            # Reus (Ryanair la vende come "Barcellona")

